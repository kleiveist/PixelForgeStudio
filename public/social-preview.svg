<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PixelForge Prompt Studio — Pixel-art prompts, built for your world.</title>
  <desc id="description">Version 1.0.0. A local-first, German and English prompt studio with reusable production rules, nine asset categories, Markdown and JSON exports, and Docker Compose self-hosting. Illustrated workflow, not generated artwork.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101920"/>
      <stop offset="1" stop-color="#122a2c"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#b5ef8c"/>
      <stop offset="1" stop-color="#63d3b5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#c2eed9" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M0 0h1200v6H0z" fill="url(#accent)"/>
  <g transform="translate(49 43) scale(1.2)" fill="#a7e886">
    <path fill-rule="evenodd" d="M8 8h40v8h8v24h-8v8H32v8H16v-8H8V8Zm8 8v24h8V24h24v-8H16Zm16 16v8h16v-8H32Z"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#f1f6f7">
    <text x="135" y="80" font-size="32" font-weight="750">PixelForge</text>
    <text x="136" y="106" font-size="16" letter-spacing="2.5" fill="#a7e886">PROMPT STUDIO</text>
    <rect x="1039" y="53" width="103" height="37" rx="9" fill="#203b32" stroke="#a7e886" stroke-opacity=".4"/>
    <text x="1090" y="78" text-anchor="middle" font-size="19" font-weight="650" fill="#b9ee9d">v1.0.0</text>
    <text x="58" y="220" font-size="14" font-weight="650" letter-spacing="3" fill="#8bbcaf">CONSISTENCY STARTS HERE</text>
    <text x="54" y="287" font-size="56" font-weight="780" letter-spacing="-1.5">Pixel-art prompts.</text>
    <text x="54" y="354" font-size="56" font-weight="780" letter-spacing="-1.5" fill="#afea90">Built for your world.</text>
    <text x="59" y="408" font-size="22" fill="#becdd2">Your camera. Your style. Your production rules.</text>
    <text x="59" y="441" font-size="22" fill="#becdd2">Reusable profiles. Data that stays with you.</text>
    <g font-size="16" font-weight="600">
      <rect x="58" y="482" width="122" height="37" rx="8" fill="#213536" stroke="#35514d"/>
      <text x="119" y="507" text-anchor="middle">Local-first</text>
      <rect x="190" y="482" width="101" height="37" rx="8" fill="#213536" stroke="#35514d"/>
      <text x="240" y="507" text-anchor="middle">DE / EN</text>
      <rect x="301" y="482" width="122" height="37" rx="8" fill="#213536" stroke="#35514d"/>
      <text x="362" y="507" text-anchor="middle">Open source</text>
    </g>
    <rect x="701" y="162" width="441" height="357" rx="18" fill="#0d171d" stroke="#426256"/>
    <rect x="721" y="182" width="401" height="91" rx="11" fill="#1c2d31"/>
    <text x="741" y="209" font-size="13" letter-spacing="1.4" fill="#91cbaa">01 · PRODUCTION RULES</text>
    <text x="741" y="246" font-size="23" font-weight="650">32 px grid</text>
    <path d="M888 226v26" stroke="#536b6b"/>
    <text x="910" y="246" font-size="23" font-weight="650">80 px figures</text>
    <path d="M922 279v13m-4-4 4 4 4-4" fill="none" stroke="#82b39a" stroke-width="2"/>
    <rect x="721" y="299" width="401" height="73" rx="11" fill="#1c2d31"/>
    <text x="741" y="324" font-size="13" letter-spacing="1.4" fill="#91cbaa">02 · NINE ASSET CATEGORIES</text>
    <text x="741" y="352" font-size="19">Characters · Nature · Tilesets · …</text>
    <path d="M922 378v13m-4-4 4 4 4-4" fill="none" stroke="#82b39a" stroke-width="2"/>
    <rect x="721" y="397" width="401" height="102" rx="11" fill="#243d33" stroke="#5f8660"/>
    <text x="741" y="424" font-size="13" letter-spacing="1.4" fill="#b9ee9d">03 · CONSISTENT PROMPT OUTPUT</text>
    <text x="741" y="454" font-size="18">Main + negative + technical spec</text>
    <text x="741" y="481" font-size="15" fill="#b9ccbd">EXPORT MARKDOWN / BACK UP AS JSON</text>
    <path d="M58 557h1084" stroke="#b3d6cb" stroke-opacity=".18"/>
    <text x="58" y="592" font-size="17" fill="#a9c5bd">SELF-HOST WITH DOCKER COMPOSE</text>
    <text x="1142" y="592" text-anchor="end" font-size="17" fill="#a9c5bd">No account. No cloud. Just your studio.</text>
  </g>
</svg>
