name: pixelforge
services:
  app:
    image: ${PIXELFORGE_IMAGE:-pixelforge-prompt-studio:1.0.0}
    build:
      context: .
      args:
        VERSION: "1.0.0"
        REVISION: ${PIXELFORGE_REVISION:-unknown}
    ports:
      - "${PIXELFORGE_BIND:-127.0.0.1}:${PIXELFORGE_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
